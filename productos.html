<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Florería Bella Flor</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="img/logo.png" alt="Logo Bella Flor"> Florería Bella FlorSaly
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html" class="activo">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="comsulta.html">Consulta</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="carrito.html">🛒 Carrito <span id="contador-carrito" class="badge-carrito">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Catálogo Floral</h1>
    <div class="barra-filtros" style="margin-top: 1rem;">
      <input type="text" id="buscador" placeholder="🔍 Buscar ramo, planta o arreglo...">
      <select id="filtro-categoria">
        <option value="todas">Todas las categorías</option>
      </select>
      <select id="filtro-stock">
        <option value="todos">Todos los estados</option>
        <option value="disponible">Solo disponibles</option>
        <option value="agotado">Agotados</option>
      </select>
      <select id="orden-precio">
        <option value="defecto">Ordenar por precio</option>
        <option value="asc">Menor a mayor precio</option>
        <option value="desc">Mayor a menor precio</option>
      </select>
    </div>

    <div id="contenedor-productos" class="grid-productos"></div>
  </main>

  <footer>
    <p>&copy; 2026 Florería Bella FlorSaly - Oruro, Bolivia</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
