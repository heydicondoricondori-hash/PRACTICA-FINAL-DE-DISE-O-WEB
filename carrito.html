<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - Florería Bella Flor</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="img/logo.png" alt="Logo Bella Flor"> Florería Bella FlorSaly
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="consulta.html">Consulta</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="carrito.html" class="activo">🛒 Carrito <span id="contador-carrito" class="badge-carrito">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>🛒 Tu Carrito de Pedidos</h1>
    <div class="tabla-box" style="margin-top:1rem;">
      <table>
        <thead>
          <tr>
            <th>Arreglo / Planta</th>
            <th>Precio Unit.</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="lista-carrito"></tbody>
      </table>
      
      <div style="margin-top: 1.5rem; text-align: right;">
        <h2>Total a Pagar: <span id="total-carrito">0 Bs</span></h2>
        <div style="margin-top: 1rem;">
          <button id="btn-vaciar" class="btn btn-rojo">Vaciar Carrito</button>
          <button id="btn-comprar" class="btn btn-acento">Finalizar Pedido</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Florería Bella FlorSaly - Oruro, Bolivia</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
